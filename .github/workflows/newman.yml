
name: Newman API Testing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Newman Tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/etc/newman" \
            -w /etc/newman \
            --entrypoint sh \
            postman/newman:alpine \
            -c "npm install -g newman-reporter-htmlextra && newman run 'New Collection.postman_collection.json' --reporters cli,json,htmlextra --reporter-json-export newman-report.json --reporter-htmlextra-export newman-report.html"

      - name: Upload Newman Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Newman-Test-Reports
          path: |
            newman-report.json
            newman-report.html
